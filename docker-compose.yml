# Container + volume names retain the legacy "library-of-alexandria" prefix
# for data-stability reasons (renaming the volume would create a fresh empty
# DB and lose the corpus). The product is "Alexandria"; these are just
# infrastructure identifiers.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: library-of-alexandria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      # Host port 5434 — 5432 and 5433 are in use locally
      # (SSH tunnel on 5432, another service on 5433). Container port stays 5432.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library}"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 1gb

volumes:
  postgres-data:
    name: library-of-alexandria-pgdata
